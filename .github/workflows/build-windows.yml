name: build-windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  build_exe:
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Use the dev release channel
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: Set-Content -Path crates/wu/RELEASE_CHANNEL -Value dev -NoNewline
        shell: pwsh
      - name: Use the stable release channel
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: Set-Content -Path crates/wu/RELEASE_CHANNEL -Value stable -NoNewline
        shell: pwsh
      - name: Build .exe installer
        run: ./script/bundle-windows.ps1 -Architecture x86_64
        shell: pwsh
      - name: Verify package
        run: |
          Test-Path target/AayushiCode-x86_64.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: aayushicode-exe
          path: target/AayushiCode-*.exe
          if-no-files-found: error
      - name: Publish .exe to GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: target/AayushiCode-*.exe
